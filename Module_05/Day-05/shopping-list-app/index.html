<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <div class="app-container">
            <h1>NeXTStack List</h1>
            <div class="input-group">
                <input type="text" id="itemInput" placeholder="Add an item...">
                <button id="addBtn">Add Item-back of list</button>
                 <button id="priorityBtn">Add Item-front of list</button>
            </div>

            <ul id="shoppingList">
            </ul>

            <button id="removeFirstBtn" class="secondary">Remove first item</button>
            
            <button id="removeLastBtn" class="secondary">Remove last item</button>

        </div>

    </main>


    <script src="script.js"></script>
</body>

</html>
